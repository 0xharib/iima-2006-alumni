name = "iima-2006-alumni"
main = "worker.mjs"
compatibility_date = "2025-11-23"
keep_vars = true

[vars]
PREVIEW_LABEL = ""
PREVIEW_DEMO = ""
ACCESS_MODE = "batch"
SITE_ORIGIN = "https://iima-class-of-2006.in"
MAIL_FROM = "IIMA Class of 2006 Batch Admin <signin@iima-class-of-2006.in>"

[[d1_databases]]
binding = "DB"
database_name = "iima-2006-alumni"
database_id = "65f8c7f3-44ae-455a-98d0-17dcd12bd1ca"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "iima-2006-alumni-media"

[images]
binding = "IMAGES"

# Automatic face tagging (docs/operations.md, "Face tagging"). FACE_TAGGING (off | shadow | on) is set in the
# Cloudflare dashboard, not here: keep_vars = true keeps it across deploys, and unset means off.
[[queues.producers]]
binding = "FACE_JOBS"
queue = "face-jobs"

[[queues.consumers]]
queue = "face-jobs"
max_batch_size = 4
max_retries = 5
max_concurrency = 2
dead_letter_queue = "face-jobs-dlq"

[[containers]]
class_name = "FaceContainer"
image = "./face-service/Dockerfile"
instance_type = "standard-2"
max_instances = 2

[[durable_objects.bindings]]
name = "FACES"
class_name = "FaceContainer"

[[migrations]]
tag = "faces-v1"
new_sqlite_classes = ["FaceContainer"]

[triggers]
crons = ["17 */3 * * *"]   # face tagging batch, every 3 hours
